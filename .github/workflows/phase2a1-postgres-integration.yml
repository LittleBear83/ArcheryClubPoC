name: Phase 2A1 PostgreSQL integration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/phase-2a1-range-reporting

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ARCHERY_POSTGRES_INTEGRATION_TESTS: "1"
      NODE_ENV: test
      PGDATABASE: postgres
      PGHOST: 127.0.0.1
      PGPASSWORD: postgres
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git fetch --no-tags origin main
      - run: npm run test:postgres-integration
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/lintChangedFiles.mjs
      - run: npm run build
      - run: git diff --check
